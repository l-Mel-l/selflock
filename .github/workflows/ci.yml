name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Сборка, тесты и форматирование
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4

      - name: Установка .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Восстановление зависимостей
        run: dotnet restore SelfLock.sln

      - name: Проверка форматирования
        run: dotnet format SelfLock.sln --verify-no-changes --no-restore

      - name: Сборка Release
        run: dotnet build SelfLock.sln -c Release --no-restore

      - name: Модульные тесты
        run: >
          dotnet test SelfLock.sln -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Публикация результатов тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn

      - name: Сборка переносимого SelfLock.exe
        run: >
          dotnet publish src/SelfLock.App/SelfLock.App.csproj -c Release
          -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Публикация артефакта приложения
        uses: actions/upload-artifact@v4
        with:
          name: selflock-win-x64
          path: publish/SelfLock.exe
          if-no-files-found: error
